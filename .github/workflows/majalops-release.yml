name: MajalOps Release and Deploy

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      deploy:
        description: Deploy the immutable image after release
        required: true
        type: boolean
        default: false
      install_modules:
        description: Modules to install during deployment (comma-separated)
        required: false
        type: string
        default: ''
      upgrade_modules:
        description: Modules to upgrade during deployment (comma-separated)
        required: false
        type: string
        default: ''
      target:
        description: Deployment target (its own isolated server, DB, and secrets)
        required: true
        type: choice
        options: [platform, staging]
        default: platform
  push:
    tags:
      - "majalops-release-request-*"

concurrency:
  group: majalops-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  version:
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: version
        name: Calculate the next semantic version
        env:
          BUMP: ${{ inputs.bump }}
          REQUEST_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${BUMP:-}" ]]; then
            case "$REQUEST_REF" in
              majalops-release-request-major-*) BUMP="major" ;;
              majalops-release-request-minor-*) BUMP="minor" ;;
              majalops-release-request-patch-*) BUMP="patch" ;;
              *) echo "Invalid release-request tag: $REQUEST_REF" >&2; exit 1 ;;
            esac
          fi
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          latest="${latest:-v0.0.0}"
          IFS=. read -r major minor patch <<<"${latest#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unknown bump: $BUMP" >&2; exit 1 ;;
          esac
          version="${major}.${minor}.${patch}"
          git rev-parse "v${version}" >/dev/null 2>&1 && {
            echo "Tag v${version} already exists" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - id: image
        name: Calculate lowercase GHCR image name
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/majalops-platform"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-24.04
    needs: version
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v6

      - name: Fetch pinned BIM browser libraries
        working-directory: construction-erp
        run: ./scripts/fetch-bim-libs.sh

      - name: Resolve the Odoo base image digest
        id: base
        run: |
          set -euo pipefail
          docker pull odoo:18.0
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' odoo:18.0)"
          [[ "$digest" == *@sha256:* ]]
          echo "image=$digest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.platform
          push: true
          platforms: linux/amd64
          build-args: |
            ODOO_BASE_IMAGE=${{ steps.base.outputs.image }}
            VCS_REF=${{ github.sha }}
            BUILD_VERSION=${{ needs.version.outputs.version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ${{ needs.version.outputs.image }}:${{ needs.version.outputs.version }}
            ${{ needs.version.outputs.image }}:sha-${{ github.sha }}
            ${{ needs.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - id: ref
        run: |
          image_ref="${{ needs.version.outputs.image }}@${{ steps.build.outputs.digest }}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$image_ref" > image-reference.txt

      - name: Preserve immutable image reference for automation
        uses: actions/upload-artifact@v4
        with:
          name: majalops-image-reference
          path: image-reference.txt
          if-no-files-found: error
          retention-days: 30

      - uses: actions/attest@v4
        with:
          subject-name: ${{ needs.version.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish-release:
    runs-on: ubuntu-24.04
    needs: [version, build]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create signed-by-GitHub annotated tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" -m "MajalOps $VERSION"
          git push origin "$TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          printf "Container image: \`%s\`\n\nSource: \`%s\`\n" "$IMAGE_REF" "$GITHUB_SHA" > release-notes.md
          gh release create "$TAG" --verify-tag --generate-notes --notes-file release-notes.md

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    runs-on: ubuntu-24.04
    needs: [version, build, publish-release]
    environment: ${{ inputs.target }}
    steps:
      - id: target
        name: Resolve the secret/variable prefix for this target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "$TARGET" == "platform" || "$TARGET" == "staging" ]] || {
            echo "Unknown deployment target: $TARGET" >&2; exit 1;
          }
          echo "prefix=$(printf '%s' "$TARGET" | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_OUTPUT"

      - name: Configure strict SSH trust
        env:
          SSH_PRIVATE_KEY: ${{ secrets[format('{0}_SSH_PRIVATE_KEY', steps.target.outputs.prefix)] }}
          KNOWN_HOSTS: ${{ secrets[format('{0}_KNOWN_HOSTS', steps.target.outputs.prefix)] }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/majalops_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/majalops_deploy ~/.ssh/known_hosts

      - name: Deploy immutable image
        env:
          HOST: ${{ vars[format('{0}_HOST', steps.target.outputs.prefix)] }}
          PORT: ${{ vars[format('{0}_SSH_PORT', steps.target.outputs.prefix)] }}
          USER: ${{ vars[format('{0}_SSH_USER', steps.target.outputs.prefix)] }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALL_MODS: ${{ inputs.install_modules }}
          UPGRADE_MODS: ${{ inputs.upgrade_modules }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          module_pattern='^([a-zA-Z0-9_]+(,[a-zA-Z0-9_]+)*)?$'
          [[ "$INSTALL_MODS" =~ $module_pattern ]] || { echo "Invalid install_modules input" >&2; exit 1; }
          [[ "$UPGRADE_MODS" =~ $module_pattern ]] || { echo "Invalid upgrade_modules input" >&2; exit 1; }
          ssh_args=(-i ~/.ssh/majalops_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${PORT:-22}")
          target="${USER:-majaldeploy}@${HOST:?${TARGET^^}_HOST is required}"
          # Values expand locally by design; the server-side wrapper validates both allow-listed formats.
          # shellcheck disable=SC2029
          printf '%s' "$GH_TOKEN" | ssh "${ssh_args[@]}" "$target" \
            "sudo /usr/local/sbin/majalops-deploy registry-login ${GITHUB_ACTOR}"
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "$target" \
            "sudo /usr/local/sbin/majalops-deploy update '${IMAGE_REF}' '${INSTALL_MODS}' '${UPGRADE_MODS}'"
          ssh "${ssh_args[@]}" "$target" \
            "sudo /usr/local/sbin/majalops-deploy health"

  cleanup-request-tag:
    if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/majalops-release-request-') }}
    runs-on: ubuntu-24.04
    needs: [version, build, publish-release]
    steps:
      - name: Remove one-time release request tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUEST_TAG: ${{ github.ref_name }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${REQUEST_TAG}"
