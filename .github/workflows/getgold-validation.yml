name: Get Gold validation

on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', 'supabase/**', 'package*.json', 'next.config.*', 'tsconfig.json', '.github/workflows/getgold-validation.yml']
  push:
    branches: ['claude/goldhub-marketplace-mvp-pYHzs']
    paths: ['src/**', 'tests/**', 'scripts/**', 'supabase/**', 'package*.json', 'next.config.*', 'tsconfig.json', '.github/workflows/getgold-validation.yml']

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start isolated Supabase and apply all migrations
        run: supabase start -x studio,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Run rollback-only database regression tests
        run: supabase test db --local
      - name: Lint database routines and security
        run: |
          supabase db lint --local --level warning --fail-on warning
          supabase db advisors --local --type security --level warn --fail-on warn
      - name: Exercise Auth, email, PostgREST and route handlers
        run: npm run test:integration
