name: Marketplace CI

# Only the Next.js app at the repository root is covered here. The repository
# also holds an unrelated Odoo project under construction-erp/, which has its
# own workflow, so paths are filtered rather than running this on every commit.
on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "scripts/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.mjs"
      - "tailwind.config.ts"
      - "postcss.config.mjs"
      - ".github/workflows/marketplace-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.mjs"
      - "tailwind.config.ts"
      - "postcss.config.mjs"
      - ".github/workflows/marketplace-ci.yml"
  workflow_dispatch:

# Keyed the same way as the ERP workflow, and for the same reason: a push to a
# branch with an open pull request fires two events, and grouping both under
# the ref alone made them cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The test scripts are run through node's TypeScript support, which
          # needs 22.6 or newer.
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run the test scripts
        run: npm test

      # The scripts exit non-zero on failure, but a harness that silently ran
      # nothing would also exit zero, so the tallies are checked explicitly.
      - name: Assert the tests actually ran
        run: |
          set -o pipefail
          npm test 2>&1 | tee ci-tests.log
          suites=$(grep -cE "^[0-9]+ passed, [0-9]+ failed$" ci-tests.log)
          if [ "$suites" -ne 3 ]; then
            echo "::error::expected 3 test suites to report a tally, saw $suites"
            exit 1
          fi
          if grep -qE "^0 passed" ci-tests.log; then
            echo "::error::a suite reported zero checks"
            exit 1
          fi
          grep -E "^[0-9]+ passed" ci-tests.log

      # Catches the client/server boundary mistakes that typecheck cannot.
      # These values only need to be present: src/lib/env.ts reads them at call
      # time, not at module load, so no real credentials are involved.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          CRON_SECRET: placeholder
          NEXT_TELEMETRY_DISABLED: "1"
