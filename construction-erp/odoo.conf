[options]
; Paths inside the Docker container (see docker-compose.yml volume mounts).
; For bare-metal runs use scripts/run-local.sh, which generates its own config.
addons_path = /mnt/custom-addons,/mnt/oca-addons,/mnt/third-party-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
db_host = db
db_user = majal_app
db_name = erp
dbfilter = ^erp$
list_db = False
proxy_mode = False
; Local direct-access profile: keep HTTP and websocket traffic on port 8069.
; Production should set workers > 0 and proxy /websocket to the evented port.
workers = 0
max_cron_threads = 1
limit_request = 4096
limit_time_real = 120
limit_time_cpu = 60
log_level = info
