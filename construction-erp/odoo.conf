[options]
; Paths inside the Docker container (see docker-compose.yml volume mounts).
; For bare-metal runs use scripts/run-local.sh, which generates its own config.
addons_path = /mnt/custom-addons,/mnt/oca-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
admin_passwd = change-me-in-production
db_host = db
db_user = odoo
db_password = odoo
proxy_mode = True
workers = 2
max_cron_threads = 1
limit_time_real = 120
limit_time_cpu = 60
log_level = info
