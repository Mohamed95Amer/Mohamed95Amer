services:
  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:?Monitoring images are not configured}
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    volumes:
      - /:/host:ro,rslave
      - /var/lib/majalops/node-exporter:/var/lib/node_exporter/textfile_collector:ro
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE:?Monitoring images are not configured}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    networks:
      - backend
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  blackbox-exporter:
    image: ${BLACKBOX_EXPORTER_IMAGE:?Monitoring images are not configured}
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - /opt/majalops/infrastructure/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - edge
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:?Monitoring images are not configured}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://127.0.0.1:9093
    volumes:
      - /etc/majalops/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /etc/majalops/alertmanager-secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    ports:
      - 127.0.0.1:9093:9093
    networks:
      - edge
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    image: ${PROMETHEUS_IMAGE:?Monitoring images are not configured}
    restart: unless-stopped
    depends_on:
      - node-exporter
      - postgres-exporter
      - blackbox-exporter
      - alertmanager
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - /etc/majalops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/majalops/infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  monitoring:
    internal: true

volumes:
  alertmanager-data:
  prometheus-data:
