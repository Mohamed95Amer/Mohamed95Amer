<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSM Copilot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header id="header">
      <div id="logo">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="7" r="4"/>
            <path d="M4 21c0-4.418 3.582-8 8-8s8 3.582 8 8"/>
          </svg>
        </div>
        <span>CSM Copilot</span>
      </div>
      <div id="header-actions">
        <button id="feedback-btn" title="Send Feedback">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
        <button id="settings-btn" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Phase bar -->
    <nav id="phase-bar">
      <div class="phase" data-phase="extract">
        <span class="phase-dot"></span>
        <span class="phase-label">Extract</span>
      </div>
      <div class="phase-connector"></div>
      <div class="phase" data-phase="research">
        <span class="phase-dot"></span>
        <span class="phase-label">Research</span>
      </div>
      <div class="phase-connector"></div>
      <div class="phase" data-phase="analyze">
        <span class="phase-dot"></span>
        <span class="phase-label">Analyze</span>
      </div>
      <div class="phase-connector"></div>
      <div class="phase" data-phase="review">
        <span class="phase-dot"></span>
        <span class="phase-label">Review</span>
      </div>
      <div class="phase-connector"></div>
      <div class="phase" data-phase="execute">
        <span class="phase-dot"></span>
        <span class="phase-label">Execute</span>
      </div>
    </nav>

    <!-- Main content area -->
    <main id="content"></main>

  </div>
  <script src="app.js" type="module"></script>
</body>
</html>
